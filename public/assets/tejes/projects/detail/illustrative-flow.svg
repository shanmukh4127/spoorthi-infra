    <rect x="174" y="438" width="187" height="143" rx="70" fill="#e9dfd6"/>
    <rect x="390" y="287" width="304" height="255" rx="28" fill="#e7d9c8"/>
    <rect x="830" y="244" width="368" height="214" rx="28" fill="#e6d8c6"/>
