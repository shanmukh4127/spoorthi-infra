  <text x="88" y="942" fill="#7c6a72" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">ILLUSTRATIVE CONCEPT DIAGRAM · NOT AN APPROVED PROJECT DRAWING · NOT TO SCALE</text>
  <g fill="none" stroke="#c8b9ab" stroke-width="3"><path d="M144 180H1456V832H144Z"/><path d="M144 502H1456" stroke-dasharray="8 12"/><path d="M780 180V832" stroke-dasharray="8 12"/></g>
  <g fill="none" stroke="#875d7f" stroke-width="6" marker-end="url(#arrow)" opacity=".72">
    <path d="M260 511C390 512 431 432 532 408"/>
    <path d="M649 406C737 347 816 323 922 337"/>
    <path d="M651 454C744 543 855 567 939 574"/>
    <path d="M577 514C584 609 565 653 561 709"/>
  </g>
