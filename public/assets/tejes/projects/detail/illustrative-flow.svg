<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative spatial flow study</title>
  <desc id="desc">A conceptual diagram of public and private room relationships. It is not an approved client or construction drawing.</desc>
  <defs>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#dfd5ca" stroke-width=".7"/></pattern>
